<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회귀한 MD가 K뷰티 전설이 되다</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2a2135; --paper:#fff8ec; --cream:#fdf0d8; --pink:#ff8fb1; --pink2:#ffd3e1;
  --mint:#7fd8be; --mint2:#d4f5ea; --sky:#8ec5ff; --sky2:#dcecff; --sun:#ffd166; --sun2:#fff1c7;
  --red:#ef476f; --green:#2bb673; --gray:#9b93a6; --floor:#e9d6b8; --wall:#c9b8e8;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#3b2f4a;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px}
button{font-family:inherit}
.h{font-family:'Do Hyeon','Noto Sans KR',sans-serif;font-weight:400;letter-spacing:.5px}
.px{border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);background:var(--paper)}
.btn{font-family:'Do Hyeon',sans-serif;font-size:16px;border:3px solid var(--ink);background:var(--sun);color:var(--ink);padding:6px 12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .05s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.pink{background:var(--pink)} .btn.mint{background:var(--mint)} .btn.sky{background:var(--sky)} .btn.gray{background:#ddd}
.btn:disabled{background:#ccc;color:#888;cursor:not-allowed;box-shadow:2px 2px 0 #888;border-color:#888}
.btn.sm{font-size:14px;padding:3px 8px}
#app{max-width:1200px;margin:0 auto;padding:12px}
/* top bar */
#top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;background:var(--sun2)}
#top .title{font-size:24px;margin-right:6px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:2px solid var(--ink);background:#fff;font-weight:700;white-space:nowrap}
.chip small{font-weight:400;color:#6b6178}
#speed{margin-left:auto;display:flex;gap:4px}
#speed .btn{padding:3px 9px;font-size:15px}
#speed .btn.on{background:var(--pink)}
/* layout */
#main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;margin-top:14px}
@media (max-width:860px){#main{grid-template-columns:minmax(0,1fr)}}
#main>div{min-width:0}
/* office */
#officeWrap{padding:0;overflow:hidden}
#officeHead{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:var(--wall);border-bottom:3px solid var(--ink)}
#office{position:relative;background:
  repeating-linear-gradient(0deg,transparent 0 31px,rgba(0,0,0,.06) 31px 32px),
  repeating-linear-gradient(90deg,transparent 0 31px,rgba(0,0,0,.06) 31px 32px),var(--floor);
  min-height:270px;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;align-content:start}
.desk{position:relative;background:#fff;border:3px solid var(--ink);padding:6px 6px 5px;text-align:center;box-shadow:3px 3px 0 rgba(0,0,0,.35);cursor:pointer}
.desk.away{opacity:.55}
.desk .face{font-size:30px;line-height:1.1;display:block;filter:drop-shadow(1px 1px 0 rgba(0,0,0,.2))}
.desk.work .face{animation:bob .6s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.desk .nm{font-weight:700;font-size:13px}
.desk .rl{font-size:11px;color:#6b6178}
.bar{height:7px;border:2px solid var(--ink);background:#eee;margin-top:3px;position:relative}
.bar i{display:block;height:100%;background:var(--green)}
.bar.mor i{background:var(--pink)}
.desk.empty{border-style:dashed;background:rgba(255,255,255,.35);box-shadow:none;color:#7a6c58;display:flex;align-items:center;justify-content:center;min-height:104px;font-family:'Do Hyeon';font-size:15px}
.float{position:absolute;left:50%;top:0;transform:translateX(-50%);font-weight:700;font-size:12px;pointer-events:none;white-space:nowrap;animation:up 1.2s ease-out forwards;text-shadow:1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff}
@keyframes up{0%{opacity:1;top:-2px}100%{opacity:0;top:-34px}}
#devBox{padding:10px;border-top:3px solid var(--ink);background:var(--mint2)}
.prog{height:16px;border:3px solid var(--ink);background:#fff;margin:6px 0}
.prog i{display:block;height:100%;background:repeating-linear-gradient(45deg,var(--mint) 0 8px,#5cc9a7 8px 16px)}
.dims{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px}
.dims b{display:block;font-size:15px}
/* panel */
#panel{padding:0;display:flex;flex-direction:column;min-height:420px}
#tabs{display:flex;flex-wrap:wrap;border-bottom:3px solid var(--ink);background:var(--pink2)}
#tabs button{flex:1;min-width:64px;font-family:'Do Hyeon';font-size:15px;padding:7px 4px;border:0;border-right:2px solid var(--ink);background:transparent;cursor:pointer}
#tabs button:last-child{border-right:0}
#tabs button.on{background:var(--pink);}
#tabBody{padding:10px;overflow:auto;max-height:560px}
.card{border:2px solid var(--ink);background:#fff;padding:8px;margin-bottom:8px}
.card h4{margin:0 0 4px;font-family:'Do Hyeon';font-weight:400;font-size:17px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;padding:1px 6px;border:2px solid var(--ink);font-size:11px;font-weight:700;background:#fff}
.tag.g4{background:#ffd166}.tag.g3{background:#b8f2d8}.tag.g2{background:#e6e1ee}.tag.g1{background:#ffc2c2}
.tag.big{background:#ff8fb1}.tag.mid{background:#8ec5ff}.tag.flop{background:#ccc}
.muted{color:#6b6178;font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{border:2px solid var(--ink);padding:4px 6px;text-align:left}
table.t th{background:var(--sun2);font-family:'Do Hyeon';font-weight:400;font-size:14px}
table.t tr.me td{background:var(--pink2);font-weight:700}
/* log */
#log{margin-top:14px;padding:8px 10px;max-height:150px;overflow:auto;font-size:13px;background:#fffdf6}
#log div{padding:2px 0;border-bottom:1px dashed #d8cdb9}
#log .when{color:#8a7f96;margin-right:6px;font-size:12px}
/* modal */
#modalBg{position:fixed;inset:0;background:rgba(30,20,40,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
#modal{width:min(640px,100%);max-height:92vh;overflow:auto;padding:14px 16px;background:var(--paper)}
#modal h2{margin:0 0 8px;font-family:'Do Hyeon';font-weight:400;font-size:24px}
#modal .body{line-height:1.6}
#modal .choices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#modal .choices .btn{text-align:left}
#modal .choices .btn small{display:block;font-family:'Noto Sans KR';font-size:12px;color:#4d4459}
.pick{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.pick button{font-family:'Noto Sans KR';font-size:13px;border:2px solid var(--ink);background:#fff;padding:4px 9px;cursor:pointer}
.pick button.on{background:var(--sun);font-weight:700}
.pick button:disabled{opacity:.35;cursor:not-allowed}
.revs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rev{border:2px solid var(--ink);padding:6px;background:#fff}
.rev .sc{font-family:'Do Hyeon';font-size:26px}
.big-outcome{font-family:'Do Hyeon';font-size:46px;text-align:center;margin:6px 0;letter-spacing:4px}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:#fff;padding:6px 12px;border:3px solid #fff;font-weight:700;animation:fade 3.2s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(-8px)}10%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#start{max-width:560px;margin:40px auto;padding:22px;text-align:center}
#start input{font-size:18px;padding:8px;border:3px solid var(--ink);width:80%;margin:10px 0;font-family:inherit;text-align:center}
.logo{font-family:'Do Hyeon';font-size:54px;margin:4px 0;text-shadow:3px 3px 0 var(--pink)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 10px;font-size:12px;margin-top:4px}
.ticker{font-size:12px;color:#4d4459;margin-top:4px}
.leadgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin:4px 0 8px;font-size:12px}
.leadgrid label{display:flex;flex-direction:column;gap:2px;color:#6b6178}
.leadgrid select{font-family:inherit;font-size:12px;padding:3px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
@media (max-width:520px){.leadgrid{grid-template-columns:1fr}}
.bars6{display:grid;grid-template-columns:1fr 1fr;gap:3px 14px;margin:5px 0;font-size:12px}
.b6{display:flex;align-items:center;gap:6px}
.b6 span:first-child{width:40px;color:#6b6178;white-space:nowrap}
.seg{display:flex;gap:2px;flex:1}
.seg i{flex:1;height:9px;background:#efe7f6;border:1px solid #c9bcd6}
.seg i.on{background:var(--pink);border-color:var(--ink)}
.b6 b{width:16px;text-align:right;font-family:'Do Hyeon';font-size:14px;font-weight:400}
@media (max-width:520px){.bars6{grid-template-columns:1fr}}

#weekbar{height:6px;background:rgba(255,255,255,.15);margin:6px 2px 0;border:2px solid var(--ink);overflow:hidden}
#weekbar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--sun) 0 10px,var(--pink) 10px 20px)}
#sky{position:relative;height:30px;border-bottom:3px solid var(--ink);transition:background .8s;overflow:hidden}
#sky .sun{position:absolute;top:3px;font-size:20px;transition:left .8s ease}
#sky .skytxt{position:absolute;right:8px;top:6px;font-family:'Do Hyeon';font-size:14px;color:var(--ink)}
#sky.night .skytxt{color:#fff}
#office{transition:filter .8s}
#office.night{filter:brightness(.82) saturate(.9)}
.mbanner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:rgba(255,255,255,.92);border:3px solid var(--ink);padding:8px 26px;text-align:center;z-index:5;animation:mb 1.7s ease forwards;pointer-events:none}
.mbanner b{display:block;font-family:'Do Hyeon';font-size:34px;font-weight:400}
.mbanner span{font-size:12px;color:#6b6178}
@keyframes mb{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%)}}
.datechip.flip{animation:flip .45s ease}
@keyframes flip{0%{transform:rotateX(90deg);background:var(--sun)}100%{transform:none}}
.desk.lead{border-color:#d6336c;box-shadow:3px 3px 0 #d6336c}
.prog{position:relative}
.prog em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.stgs{display:flex;flex-wrap:wrap;gap:4px;font-size:11px;margin:2px 0 4px}
.stg{border:2px dashed #b9aac8;padding:1px 5px;color:#8a7f96}
.stg.done{border-style:solid;border-color:var(--ink);color:var(--ink);background:#fff}
.nameinput{width:100%;font-size:16px;padding:6px;border:3px solid var(--ink);font-family:inherit;margin-bottom:4px}
.hofline{margin:8px 0;padding:6px;border:2px solid var(--ink);background:var(--sun2)}
.fans{margin-top:4px}
.fanrow{display:flex;align-items:center;gap:6px;font-size:12px;margin:2px 0}
.fanrow span:first-child{width:96px;color:#6b6178}
.fbar{flex:1;height:10px;border:2px solid var(--ink);background:#fff}
.fbar i{display:block;height:100%;background:var(--mint)}
.fanrow b{width:56px;text-align:right}
.pick button small{display:block;font-weight:400}

.margin{border:2px solid var(--ink);background:#fff;padding:6px 8px;margin:4px 0 8px;font-size:12px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px}
.margin div{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.margin div span:first-child{color:#6b6178;min-width:84px}
.margin div:last-child{grid-column:1/-1}
.pslider{width:100%;accent-color:#ff8fb1;margin:4px 0}
#log .loghead{font-family:'Do Hyeon';font-size:15px;border-bottom:2px solid var(--ink);margin-bottom:2px}
#log .new{background:var(--sun2);font-weight:700}
@media (max-width:520px){.margin{grid-template-columns:1fr}}
.desk.locked{color:#9b8fb0;font-size:13px;line-height:1.4;cursor:default;background:rgba(0,0,0,.05)}

/* ===== v0.8 레이아웃 ===== */
#hdr{position:sticky;top:0;z-index:30;background:#3b2f4a;padding-top:4px}
#top{display:block;padding:6px 8px}
.trow{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.trow .title{font-size:22px;margin-right:4px}
#speed{margin-left:auto;display:flex;gap:4px}
.chip.inbox{background:var(--pink);cursor:pointer;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.chip.dbtn{cursor:pointer;background:var(--sky2);font-family:'Do Hyeon';font-weight:400}
.tdetail{margin-top:6px;padding-top:6px;border-top:2px dashed var(--ink);font-size:13px;line-height:1.6}
#tabs button{position:relative}
#tabs .badge{display:inline-block;min-width:16px;margin-left:3px;padding:0 4px;background:var(--red);color:#fff;font-style:normal;font-size:11px;border-radius:8px;line-height:16px}
#ticker{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--ink);color:#fff;font-size:12px;padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;border-top:3px solid var(--pink)}
#ticker .when{color:var(--sun);margin-right:6px}
#ticker b{color:var(--sun)}
body{padding-bottom:40px}
#office{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;min-height:170px;padding:10px}
.desk{padding:4px 4px 4px}
.desk .face{font-size:24px}
.desk .nm{font-size:12px}
.desk.empty{min-height:78px;font-size:13px}
details.card summary{cursor:pointer}
@media (max-width:640px){
  #app{padding:6px}
  #hdr{padding-top:2px}
  #top{padding:5px 6px}
  .trow{gap:3px}
  .trow .title{display:none}
  .chip{font-size:12px;padding:2px 5px;border-width:2px}
  #speed{gap:2px}
  #speed .btn{padding:1px 6px;font-size:12px;box-shadow:2px 2px 0 var(--ink)}
  #main{gap:10px;margin-top:8px}
  #officeHead{padding:4px 8px}
  #officeHead .h{font-size:15px!important}
  #office{grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:5px;min-height:0;padding:6px}
  .desk{padding:3px 2px;border-width:2px;box-shadow:2px 2px 0 rgba(0,0,0,.3)}
  .desk .face{font-size:19px}
  .desk .nm{font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .desk .rl{font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .desk .bar{height:5px;border-width:1px;margin-top:2px}
  .desk.empty{min-height:56px;font-size:11px}
  #sky{height:24px}
  #sky .sun{font-size:16px} #sky .skytxt{font-size:12px;top:4px}
  #devBox{padding:6px}
  #devBox .h{font-size:15px!important}
  #tabs{flex-wrap:nowrap;overflow-x:auto}
  #tabs button{flex:0 0 auto;min-width:52px;font-size:13px;padding:6px 8px}
  #tabBody{max-height:none;padding:6px}
  .card{padding:6px}
  .card h4{font-size:15px}
  .btn.sm{font-size:12px;padding:2px 6px}
  .px{box-shadow:3px 3px 0 var(--ink)}
  #modal{padding:10px}
  #modal h2{font-size:19px}
  #log{max-height:120px;font-size:12px}
  .bars6{gap:2px 8px;font-size:11px}
  .stat-grid{grid-template-columns:repeat(2,1fr);font-size:11px}
}

#toast{top:auto;bottom:46px}
#toast div{font-size:13px;max-width:92vw}
@media (max-width:640px){ #toast div{font-size:12px;padding:4px 8px} }

@media (max-width:640px){
  #office{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
  .bars6{grid-template-columns:1fr 1fr!important;gap:2px 8px}
  .b6{gap:3px}
  .b6 span:first-child{width:32px;font-size:10px}
  .seg{gap:1px}
  .seg i{height:7px}
  .b6 b{width:12px;font-size:12px}
}
.b6 b.sv{width:auto;min-width:42px;font-size:13px;white-space:nowrap}
.b6 b.sv em{font-style:normal;font-size:10px;margin-left:2px;padding:0 3px;border:1px solid var(--ink);background:var(--sun2)}
@media (max-width:640px){.b6 b.sv{min-width:34px;font-size:11px}}
.luck{color:#b07d00;font-size:11px}
.sr{text-align:center;padding:4px 0}
.sr-name{font-weight:bold;font-size:15px}
.sr-msg{margin:8px 0 2px;color:#6b4e9b;font-size:13px;min-height:18px}
.sr-num{font-size:44px;font-weight:900;letter-spacing:1px;font-variant-numeric:tabular-nums;color:#3a2e5c;line-height:1.1}
.sr-num.pop{animation:srpop .45s ease-out}
.sr-unit{font-size:12px;color:#888}
.sr-stamp{font-size:34px;font-weight:900;margin-top:6px;opacity:0;transform:scale(2.6) rotate(-12deg);transition:all .35s cubic-bezier(.2,1.6,.4,1)}
.sr-stamp.show{opacity:1;transform:scale(1) rotate(-6deg)}
.sr-after{opacity:0;transition:opacity .5s .3s;margin-top:6px;font-size:13px}
.sr-after.show{opacity:1}
@keyframes srpop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
#modal select{font-family:inherit;font-size:13px;padding:5px;border:2px solid #3a2e5c;border-radius:6px;background:#fff}
.ivh{font-size:13px;margin-bottom:6px}
.ivn{background:#f6f1ff;border-left:3px solid #9b7fd1;padding:6px 8px;margin:6px 0;font-size:13px;border-radius:4px}
.ivq{font-size:16px;font-weight:bold;margin:10px 0 2px;color:#3a2e5c}
.plan{background:#fff8e6;border:2px dashed #e0a000;border-radius:6px;padding:6px 8px;margin-top:4px;font-size:12.5px;line-height:1.6;color:#3a2e5c}
/* 도트 스프라이트 */
.spr{display:inline-block;width:48px;height:48px;background:url(img/staff48.png) no-repeat;background-size:192px 144px;background-position:calc(var(--sx)*-48px) calc(var(--sy)*-48px);image-rendering:pixelated;vertical-align:middle}
.spr.dk{display:block;margin:0 auto -2px}
.spr.sm{width:36px;height:36px;background-image:url(img/staff36.png);background-size:144px 108px;background-position:calc(var(--sx)*-36px) calc(var(--sy)*-36px)}
.desk .face{position:absolute;right:4px;top:2px;font-size:15px}
.desk.work .spr{animation:bob .6s steps(2) infinite}
.desk.work .face{animation:none}
.spr.hop{animation:hop .35s steps(2) 4 !important}
@keyframes hop{50%{transform:translateY(-8px)}}
@media (max-width:640px){ .spr.dk{width:36px;height:36px;background-image:url(img/staff36.png);background-size:144px 108px;background-position:calc(var(--sx)*-36px) calc(var(--sy)*-36px)} .desk .face{font-size:12px} }
.itm{display:inline-block;width:48px;height:48px;background:url(img/items.png) no-repeat;background-size:192px 144px;background-position:calc(var(--sx)*-48px) calc(var(--sy)*-48px);image-rendering:pixelated;vertical-align:middle}
.itm.sm{width:24px;height:24px;background-size:96px 72px;background-position:calc(var(--sx)*-24px) calc(var(--sy)*-24px);image-rendering:auto}
.itm.big{width:96px;height:96px;background-size:384px 288px;background-position:calc(var(--sx)*-96px) calc(var(--sy)*-96px);display:block;margin:0 auto}
.ico{display:inline-block;width:48px;height:48px;background:url(img/icons.png) no-repeat;background-size:192px 144px;background-position:calc(var(--sx)*-48px) calc(var(--sy)*-48px);image-rendering:pixelated;vertical-align:middle}
.ico.pop{width:64px;height:64px;background-size:256px 192px;background-position:calc(var(--sx)*-64px) calc(var(--sy)*-64px);image-rendering:auto;animation:icpop .5s cubic-bezier(.2,1.6,.4,1)}
.ico.shake{animation:icshake .25s steps(2) infinite}
.sr-ic{height:66px}
@keyframes icpop{0%{transform:scale(.2)}100%{transform:scale(1)}}
@keyframes icshake{50%{transform:translateY(-4px) rotate(-6deg)}}
#obg{aspect-ratio:4/1;background:url(img/offices10.png) no-repeat 0 0;background-size:100% 1000%;image-rendering:pixelated;border-bottom:3px solid var(--ink);transition:filter .8s}

    const req=Math.round(Math.max((5+8*S.stage)*t.w, teamWeekly(t.dim)*t.w)*diff*rnd(0.9,1.1));

function planScore(c){
  const cp=compat(c.cat,c.con,c.tar,c.trb), seg=segSize(c.tar,c.trb), rep=repeatN(`${c.cat}|${c.con}|${c.tar}|${c.trb}`);
  const comp=(S.compHits||[]).filter(h=>h.g&&h.g[0]===c.cat).length + COMPS.filter(x=>x.con===c.con).length*0.5;
  return {cp, seg, rep, comp, v: cp*2 + Math.log10(seg/1e5)*1.2 + (trendBoost(c.cat,c.con,S.month)-1)*4 + (c.con===S.boom?1.2:0) - rep*1.5 - comp*0.6 + (catLv(c.cat)-1)*0.2};
}
function planProduct(s){
  const sk=mainStat(s), n=clamp(3+Math.floor(sk/30),3,14), noise=clamp(3-sk/60,0.3,3);
  const cats=CATS.filter(x=>!locked(x)), cons=CONCEPTS.filter(x=>!locked(x)), tars=TARGETS.filter(x=>!locked(x)), trbs=TROUBLES.filter(x=>!locked(x));
  let best=null;
  for(let i=0;i<n;i++){ const c={cat:pick(cats).k, con:pick(cons).k, tar:pick(tars).k, trb:pick(trbs).k}; const sc=planScore(c); const v=sc.v+rnd(-noise,noise);
    if(!best||v>best.v) best=Object.assign(c,{v,sc}); }
  if(!best) return null;
  const pref=TPREF[best.tar]; best.ratio = Math.round(pref*(sk>=60?1:rnd(0.8,1.35))/0.05)*0.05;
  return best;
}
function planDetail(pl,s){

  const why = sc.cp>=4 ? `${pl.con}은(는) ${pl.trb} 고민에 딱 맞는 원료입니다` : sc.comp<0.5 ? `${pl.tar} ${pl.trb} 시장에 경쟁 제품이 거의 없습니다` : pl.con===S.boom ? `올해 ${pl.con}이(가) 뜨고 있습니다` : sc.rep>0 ? '지난번 반응이 좋아서 비슷하게 가봤습니다' : sk<40 ? '그냥... 느낌이 좋아요!' : `${pl.tar} 수요가 꾸준한 카테고리입니다`;

}

const OPS_ROLES=['운영','수석연구원','뷰티디렉터'];

function skusOf(s){ if(s.sku!==undefined&&!s.skus){ s.skus=s.sku?[s.sku]:[]; delete s.sku; } return s.skus||(s.skus=[]); }

function autoOrder(){
  if(S.autoOrder===false) return;
  assignSku();
  const fixed = payroll()+OFFICES[S.office].rent;
  for(const p of S.products){
    let o=opsFor(p); if(!o) continue;
    if(o.away || o.off){ const sub=opsList().filter(x=>!x.away&&!x.off).sort((a,b)=>b.st.safe-a.st.safe)[0]; if(!sub) continue; o=sub; }
    const acc = clamp(o.st.safe/60, 0.3, 1); // 운영 능력이 높을수록 수요 예측 정확
    const w=abs()-p.rel; if(p.disc || p.ending || p.susp>abs()) continue;
    const demand = Math.max(p.week + (p.lostLast||0), w<3?200:p.stock<=0?100:0) * (1 + (1-acc)*rnd(-0.5,0.5)) * (1 + (p.viral>0.5?0.5:0));
    const pend = p.orders.reduce((a,x)=>a+x.qty,0);
    if(p.stock + pend >= demand*(leadTime()+3)) continue;
    const need = demand*(leadTime()+6) - p.stock - pend;
    if(demand<=0) continue;
    const ql=[500,1000,3000,10000,30000,100000,300000,1000000].filter(q=>q<=qtyList().slice(-1)[0]); let qty = ql.find(q=>q>=need) || ql[ql.length-1];
    while(qty>500 && S.cash-unitCost(p)*qty<fixed) qty=ql[ql.indexOf(qty)-1];
    const cost = unitCost(p)*qty;
    if(S.cash - cost < fixed){ if(!p.cashWarn||abs()-p.cashWarn>4){ p.cashWarn=abs(); log(`📦 ${esc(o.name)}: "${esc(p.name)} 재고가 부족한데 발주할 돈이 없어요..."`); } continue; }
    if((S.inbox||[]).some(x=>x.type==='order'&&x.pid===p.id)) continue;
    floatAt(o.id,'📝 발주 기안','#2a7');
    propose({type:'order', pid:p.id, qty, cost:Math.round(cost), by:o.name, byId:o.id, title:`${p.name} ${qty.toLocaleString()}개 발주 (${moneyShort(cost)})`,

  }
}

function saleWeekNow(){ return salesAt(abs()); }
function saleCost(){ return Math.round((150+S.stage*250)/10)*10; }
function saleSupport(){ const v=S.staff.filter(s=>(MD_ROLES.includes(s.role)||MKT_ROLES.includes(s.role))&&!s.away&&s.role!=='대표').reduce((a,s)=>a+mainStat(s),0); return Math.min(1, v/500); }
function saleProbs(ti,p){ const sup=saleSupport(), b=SALE_TIERS[ti].p.slice(); b[0]*=1-0.5*sup; b[2]*=1+0.5*sup; b[3]*=1+0.6*sup; if(p&&p.quality<50) b[0]*=1.5; if(p&&p.quality>=75){ b[2]*=1.2; b[3]*=1.2; } const t=b.reduce((a,c)=>a+c,0); return b.map(v=>v/t); }
function saleInvite(b){

  if((S.sales||[]).some(x=>x.at===abs()+3 && x.n===b.n)) return;
  const c=saleCost(), sup=saleSupport(), p0=live[0];
  const opts=live.map(p=>`<option value="${p.id}">${esc(p.name)} (재고 ${p.stock.toLocaleString()} · 주 ${p.week.toLocaleString()}개)</option>`).join('');
  const pr=(i)=>saleProbs(i,p0).map(v=>Math.round(v*100));
  queueModal({title:`${b.e} ${b.n} D-3 참가 신청`, pre:icoHtml('sale','pop'), onOpen:()=>{ jingle('hit',0.35); },
    body:`<b>${b.ch}</b>에서 3주 뒤 <b>${b.n}</b>가 열린다! 대표 상품 1개를 골라 참가하면 그 주 판매가 폭발할 수 있다. 준비를 많이 할수록 대박 확률이 올라간다.
    <div class="card" style="margin:6px 0"><div class="muted">대표 상품</div><select id="salepid" style="width:100%;margin-top:3px">${opts}</select>
    <div class="muted" style="font-size:11px;margin-top:4px">⚠️ 세일 주에는 평소의 3~5배가 팔릴 수 있다. <b>재고를 미리 넉넉히</b> 준비하자. (입고 ${leadTime()}주 소요)</div></div>
    <div class="card" style="font-size:12px">🙋 MD·마케터 지원 ${Math.round(sup*100)}% <span class="muted">(인원·능력이 높을수록 대박 확률↑)</span><br>
    ${SALE_TIERS.map((t,i)=>`<b>${t.n}</b> ${money(c*t.x)} — ${t.d}<br><span class="muted">아쉬움 ${pr(i)[0]}% · 선방 ${pr(i)[1]}% · 대박 ${pr(i)[2]}% · 전설 ${pr(i)[3]}%</span>`).join('<br>')}</div>`,
    choices:[...SALE_TIERS.map((t,i)=>({label:`${t.n} (${moneyShort(c*t.x)})${i>((S.chGrade||{})[b.ch]||0)?` 🔒 ${CH_GRADE[i]}`:''}`, disabled:S.cash<c*t.x||i>((S.chGrade||{})[b.ch]||0), fn:(el)=>{
        const sel=el&&el.querySelector&&el.querySelector('#salepid'); const pid=sel?+sel.value:p0.id;
        S.cash-=c*t.x; S.sales=S.sales||[]; S.sales.push({n:b.n,e:b.e,ch:b.ch,at:abs()+3,pid,tier:i});
        const p=S.products.find(x=>x.id===pid); log(`${b.e} ${b.n} <b>${t.n}</b> 신청 — 대표 상품 ${esc(p?p.name:'')} (${money(c*t.x)})`); }})),
      {label:'이번엔 불참', cls:'gray', fn:()=>log(`${b.e} ${b.n} 불참`)}]});
}
function saleStart(){
  for(const b of salesAt(abs()+3)) saleInvite(b);
  const now=(S.sales||[]).filter(x=>x.at===abs());
  for(const b of saleWeekNow()) if(!now.some(x=>x.n===b.n)) log(`${b.e} <b>${b.n}</b> 진행 중 (참가 안 함 — 전 제품 소폭 상승)`);
  for(const x of now){ const p=S.products.find(q=>q.id===x.pid); if(!p||p.disc){ x.done=true; continue; }
    x.res=rollIdx(saleProbs(x.tier,p)); const R=SALE_RES[x.res]; p.sale={at:abs(), m:R.m, cap:R.cap}; x.stock0=p.stock;
    log(`${x.e} <b>${x.n}</b> 개막! 대표 상품 ${esc(p.name)} 판매 시작`); }
}

        log('📈 <b>빅세일 랭킹 진입</b> 3단계 성장기'); }
      else log(`🛍️ 랭킹 진입 실패 — 필요: 인지도 30 + 대박 이상 (현재 인지도 ${S.aware.toFixed(0)} · ${R.k})`); }
  }
  S.sales=(S.sales||[]).filter(x=>!x.done && x.at>=abs());
}
function saleReveal(x,p,R,sold,lost,rev){

// ---------- 판매 ----------
function isOyWeek(){ return S.chOwned.includes('올리브영') && [3,6,9,12].includes(S.month) && S.week===1; }
function eventMult(p){
  let m=1;
  if(saleWeekNow().length) m*=1.15;
  if((S.month===1&&S.week>=3)||(S.month===9&&S.week<=2)) m*=1.3;
  if(S.month===11) m*=1.15;
  const s=seasonOf(S.month);
  if(s==='summer'&&SUMMER.includes(p.cat)) m*=1.2; if(s==='winter'&&WINTER.includes(p.cat)) m*=1.2;
  return m;
}
function salesTick(){
  let weekRev=0;
  for(const p of S.products){
    if(p.disc) continue;
    for(const o of p.orders){ if(!o.done && o.at<=abs()){ p.stock+=o.qty; o.done=true; log(`✅ ${esc(p.name)} ${o.qty.toLocaleString()}개 입고`);} }
    p.orders = p.orders.filter(o=>!o.done);
    if(p.ending && p.stock<=0 && !p.orders.length){ p.disc=true; p.week=0; log(`🛑 <b>${esc(p.name)}</b> 재고 소진으로 단종 완료`); continue; }
    const w = abs()-p.rel;
    if(w===4 && !p.outShown){ p.outShown=true; outcomeReveal(p); }
    if(w===1 && !p.chart){ const bench=Math.max(60,(S.compTop||200)*0.6), r0=p.rev/bench;
      const T=[[1.5,1,1.5],[1.0,2,1.35],[0.7,3,1.25],[0.5,5,1.15],[0.3,8,1.08],[0.15,10,1.03]].find(x=>r0>=x[0]);
      p.chart = T ? {rank:T[1], mul:T[2], until:abs()+4} : {rank:0, mul:1, until:0};
      if(T){ log(`📈 <b>${esc(p.name)}</b> 출시 첫 주 판매 차트 <b>${T[1]}위</b>! 4주간 판매 ×${T[2]}`); toast(`📈 ${esc(p.name)} 첫 주 차트 ${T[1]}위!`); }
      else log(`📉 ${esc(p.name)} 출시 첫 주 차트 순위권 밖`); }
    const life = Math.max(p.outcome===2?0.3:0.12, Math.exp(-Math.max(0,w-(p.lifeB||0))/(p.outcome===2?40:22)));
    const base = 300;
    const power = OUT[p.outcome].m * (0.5+p.quality/100) * p.seqBonus * (p.catPen||1) * priceVol(p.tar, p.ratio||1, p.quality);
    const A=ageOf(p.tar), sn=A.sns||1, u=Math.sqrt(p.ugc), nu=Math.sqrt(p.negUgc);
    const ugcF = 1 + Math.min(0.8,u/45)*sn - Math.min(0.35,nu/50);
    const hypeF = 1 + (p.hype||0)/100 * sn * Math.max(0, 1-w/6);
    const hsF = (A.hs && S.chOwned.includes('홈쇼핑')) ? A.hs : 1;
    let demand = base * power * life * (p.promo>abs()?(p.promoM||1.3):1) * (p.compPen>abs()?(p.compPenM||0.85):1) * (S.bigPress&&S.bigPress.until>abs()&&S.bigPress.con===p.con?0.9:1) * (p.chart&&p.chart.until>abs()?p.chart.mul:1) * Math.sqrt(channelMult()) * teamMult() * eventMult(p) * (1+p.mkt) * (1+p.viral*sn) * ugcF * hsF * (0.5+S.trust/100) * fanMult(p.tar) * hypeF;
    demand *= rnd(0.85,1.15);
    const sl=(p.sale&&p.sale.at===abs())?p.sale:null; if(sl) demand*=sl.m;
    { const cap=Math.max(15, segCap(p.tar,p.trb)*reachOf(p)*(sl?sl.cap:1)*reachF(p.tar,p.ratio||1)); demand = cap*(1-Math.exp(-demand/cap)); }
    if(p.susp>abs()) demand=0;
    const sold = Math.min(p.stock, Math.round(demand));
    p.lostLast = Math.max(0, Math.round(demand)-sold);
    p.stock -= sold; p.sold+=sold; p.week=sold;
    { const cl=chList(), tot=cl.reduce((a,c)=>a+c.m(S.year),0)||1; S.chSold=S.chSold||{}; for(const c of cl) S.chSold[c.k]=(S.chSold[c.k]||0)+sold*c.m(S.year)/tot; }
    const r = sold*p.price*(1-FEE); p.rev+=r; weekRev+=r;
    if(sold>0){ if(p.quality>=50) p.ugc += sold/120*(p.quality/70); else p.negUgc += sold/120;
      S.fans[p.tar] = (S.fans[p.tar]||0) + sold/30*(p.quality>=50?1:0.3); }
    if(p.promo>abs()) {}
    p.mkt *= 0.86; if(p.mkt<0.02) p.mkt=0;
    p.viral *= 0.8; if(p.viral<0.02) p.viral=0;
    gainAware(sold/(1500 + S.aware*S.aware*12));
    if(p.stock===0 && sold>0 && p.lostLast>0 && w<60){ toast(`😱 ${esc(p.name)} 품절! 발주가 필요해요`); }
  }
  S.cash += weekRev; S.yearRev += weekRev; S.totalRev += weekRev; S.lastWeekRev = weekRev;
  S.recent.push(weekRev); if(S.recent.length>8) S.recent.shift();
  const avg8=S.recent.reduce((a,b)=>a+b,0)/S.recent.length, x=Math.pow(Math.min(1,abs()/430),0.8);
  COMPS.forEach((c,i)=>{ const curve=c.s0*Math.pow(c.f/c.s0,x); const tgt=0.65*curve+0.35*Math.max(curve*0.5,avg8*c.lead);
    S.compRev[i] += tgt*S.compMul[i]*rnd(0.85,1.15); if(i===0) S.compTop=tgt*S.compMul[i]; });
  S.aware = Math.max(0, S.aware - 0.01 - S.aware*0.0015);
  for(const k in S.fans) S.fans[k]*=0.994;
}
function viralRoll(){
  for(const p of S.products){
    if(p.disc || abs()-p.rel>80 || p.susp>abs()) continue;
    const boost = (0.6 + p.nd[5]/100) * (1+p.mkt*0.3) * (1+Math.min(1,Math.sqrt(p.ugc)/30));
    const r=Math.random();
    if(r < 0.003*boost){ p.viral+=8; gainAware(6); addFans([p.tar],600);
      S.megaN=(S.megaN||0)+1;
      queueModal({onOpen:()=>jingle('hit'), title:'🌋 메가 바이럴!!!', body:`<div style="text-align:center">${icoHtml('phone','pop')}${icoHtml('fire','pop')}</div><div class="big-outcome">MEGA VIRAL</div><b>${esc(p.name)}</b> 영상이 조회수 1,000만을 넘겼다! 전국에서 주문이 쏟아진다.<br><span class="muted">재고는 충분한가요?</span>`, choices:[{label:'가자!!'}]});
      log(`🌋 <b>${esc(p.name)}</b> 메가 바이럴 폭발!`); }
    else if(r < 0.023*boost){ p.viral+=2; gainAware(3); addFans([p.tar],120); toast(`🔥 ${esc(p.name)} 중형 바이럴!`); log(`🔥 ${esc(p.name)} 숏폼 영상이 퍼지는 중`); }
    else if(r < 0.12*boost){ p.viral+=0.5; log(`✨ ${esc(p.name)} 소소하게 입소문`); }
  }
}

// ---------- 회사 레벨 ----------
const MAXCLV=100;
function clvXp(L){ return Math.round(2*Math.pow(L-1,2.2)); }
function capAt(L){ return Math.min(50, Math.max(1, Math.floor(L*0.75)+(L<4?0:0))); }
function companyXP(){ return S.totalRev/1000 + S.products.length*20 + (S.hof||[]).length*50 + (S.awards||[]).length*100; }
function hireCap(){ return Math.min(Math.max(1,capAt(S.clv||1)), OFFICES[S.office].cap-1); }
function isFull(){ return S.staff.length-1 >= hireCap(); }
function unlocksAt(a,b){ const out=[]; [[CATS,'카테고리'],[CONCEPTS,'성분'],[TARGETS,'연령'],[TROUBLES,'트러블']].forEach(([l,n])=>l.forEach(x=>{ if(x.lv>a&&x.lv<=b) out.push(`${n} <b>${x.k}</b>`); })); return out; }
function levelCheck(){
  S.clv=S.clv||1; const xp=companyXP(); let lv=S.clv;
  while(lv<MAXCLV && xp>=clvXp(lv+1)) lv++;
  if(lv>S.clv){ const old=S.clv; S.clv=lv; const un=unlocksAt(old,lv), capUp=capAt(lv)>capAt(old);
    log(`🏢 회사 레벨 <b>Lv.${lv}</b>${capUp?` — 직원 최대 ${capAt(lv)}명`:''}${un.length?` · 해금: ${un.join(', ')}`:''}`);
    if(un.length) queueModal({title:`🏢 회사 Lv.${lv} — 새로운 해금!`, body:`<div style="text-align:center">${icoHtml('rocket','pop')}</div><div class="big-outcome">Lv.${lv}</div>${un.join('<br>')}${capUp?`<br>직원 최대 <b>${capAt(lv)}명</b>`:''}`, choices:[{label:'좋았어!'}]});
    else toast(`🏢 회사 Lv.${lv}${capUp?` · 직원 최대 ${capAt(lv)}명`:''}`); }
}
// ---------- 대출 ----------
function loanLimit(){ return Math.max(0, Math.round((3000 + (S.clv||1)*800 + (S.lastYearRev||0)*0.2) * (0.5 + S.trust/100) / 100)*100 - (S.loan||0)); }
function borrow(amt, rate){
  amt=Math.round(amt); if(amt<=0) return;
  S.loanRate = ((S.loan||0)*(S.loanRate||0.06) + amt*rate) / ((S.loan||0)+amt);
  S.loan=(S.loan||0)+amt; S.cash+=amt;

function calcTax(profit, emp){
  if(profit<=0) return {base:0,tax:0,credit:0,due:0};
  let tax = profit<=20000 ? profit*0.09 : profit<=2000000 ? 1800+(profit-20000)*0.19 : 1800+1980000*0.19+(profit-2000000)*0.21;
  const credit = Math.min(tax*0.5, emp*500);
  return {base:profit, tax:Math.round(tax), credit:Math.round(credit), due:Math.round(tax-credit)};
}
function estTax(){ const p=(S.cash-(S.loan||0))-(S.yearStartNet||0); return calcTax(p, S.staff.length-1); }

function awardsCalc(){

  const res=[];
  const best = mine.slice().sort((a,b)=>b.sum-a.sum)[0];
  if(best && best.sum>compSum){ res.push({n:'🏆 올해의 대상',w:best.name,me:true}); S.cash+=3000; gainAware(6,true); addFans('all',150); }
  else res.push({n:'🏆 올해의 대상',w:`${pick(COMPS).k}`});
  [['💊 기능성상',0],['🎨 디자인상',4],['📣 화제상',5]].forEach(([n,i])=>{
    const b = mine.slice().sort((a,c)=>c.nd[i]-a.nd[i])[0];
    if(b && b.nd[i]>dimB){ res.push({n,w:b.name,me:true}); S.cash+=1000; gainAware(2,true); }

// ---------- 모달 ----------
function queueModal(m){ modalQ.push(m); if(!modalOpen) nextModal(); }
function nextModal(){
  const m=modalQ.shift(); if(!m){ modalOpen=false; $('#modalBg').style.display='none'; render(); return; }
  modalOpen=true;
  const el=$('#modal');
  el.innerHTML = `${m.pre?`<div style="text-align:center">${m.pre}</div>`:''}<h2>${m.title}</h2><div class="body">${m.body||''}</div><div class="choices"></div>`;
  const ch=el.querySelector('.choices');
  (m.choices||[{label:'확인'}]).forEach(c=>{
    const b=document.createElement('button'); b.className='btn '+(c.cls||''); b.disabled=!!c.disabled;
    b.innerHTML = esc(c.label)+(c.sub?`<small>${esc(c.sub)}</small>`:'');
    b.onclick=()=>{ if(c.keep){ c.fn&&c.fn(el); return; } c.fn&&c.fn(el); nextModal(); render(); };
    ch.appendChild(b);
  });
  if(m.onOpen) m.onOpen(el);
  $('#modalBg').style.display='flex';
  el.scrollTop=0;
}

const MAXLV=100, MASTER=30;
function kpCost(lv){ return Math.round(3 + lv*1.5 + lv*lv*0.05); }
function trainCost(lv){ return Math.round((200 + lv*lv*8)/10)*10; }
function levelUp(s, free){
  if(s.lv>=MAXLV) return false;
  s.lv++; s.roleLv[s.role]=s.lv; s.lvSinceRaise++;
  // 게임개발 스토리처럼 능력치는 확률적으로 오른다
  const ms=mainsOf(s.role), R0=ROLES[s.role], gains=[];
  const up=(k,n)=>{ if(n>0 && Math.random()<1/(1+s.st[k]/300)){ s.st[k]=Math.min(999,s.st[k]+n); gains.push(`${STATN[k]}+${n}`); } };
  if(!ms.length){ for(const k of DK) if(Math.random()<0.4) up(k,1); }
  else {
    for(const k of ms){ const r=Math.random(); up(k, r<0.05 ? Math.round(5*s.growth) : r<0.8 ? Math.max(1,Math.round(rnd(1,2.6)*s.growth*(ms.length>1?0.8:1))) : 0); }
    for(const k of R0.rel) if(Math.random()<0.45) up(k, Math.max(1,Math.round(s.growth*rnd(0.6,1.2))));
    for(const k of DK) if(!ms.includes(k)&&!R0.rel.includes(k)&&Math.random()<0.15) up(k,1);
  }
  { const sum=DK.reduce((a,k)=>a+s.st[k],0), tgt=80+sum*0.8+Math.pow(sum/100,2)*60; s.sal = s.role==='대표'?0:Math.round(Math.max(s.sal*1.01, s.sal+(tgt-s.sal)*0.25)/5)*5; }
  floatAt(s.id,gains.length?'LV UP! '+gains[0]:'LV UP!','#ef476f');
  log(`⬆️ ${esc(s.name)} ${s.role} Lv.${s.lv}${gains.length?` (${gains.join(', ')})`:' (이번엔 능력치가 오르지 않았다...)'}${s.lv===MASTER&&s.role!=='대표'?' — 🎓 마스터! 전직 가능':''}`);
  if(s.role!=='대표' && s.lvSinceRaise>=6){ s.lvSinceRaise=0; queueModal(raiseModal(s)); }
  return true;
}
function staffTick(){
  for(const s of S.staff){
    if(s.away>0){ s.away--; s.stamina=100; if(s.away===0) log(`🏖️ ${esc(s.name)} 휴가 복귀`); continue; }

      continue; }
    if(s.stamina<=3){ s.off=true; s.morale=clamp(s.morale-3,0,100); floatAt(s.id,'🏠 퇴근...','#888');

    if(!S.dev){ s.stamina=clamp(s.stamina+6+S.welfare*2,0,100); s.exp+=1.2; S.kp+=0.1; }
    else s.stamina=clamp(s.stamina+S.welfare*1.2,0,100);

  }
}

function fatigue(k){ return Math.pow(0.78, S.adUse[k]||0); }
function doMkt(p, kind, pow){
  const K = {
    sns:{n:'SNS 광고',c:300,m:0.6,f:60},
    micro:{n:'마이크로 인플루언서',c:500,m:0.9,v:1.3,f:90},
    mega:{n:'메가 인플루언서',c:3000,m:2.8,v:2,f:400},
    trial:{n:'체험단',c:200,u:40,f:30},
    sample:{n:'샘플링',c:400,u:25,a:1,f:60}
  }[kind];
  if(cdLeft('p'+p.id+kind)>0){ toast(`⏳ ${K.n} 쿨타임 ${cdLeft('p'+p.id+kind)}주 남음`); return; }
  if((p.adBan||0)>abs()){ toast(`⛔ ${esc(p.name)} 광고 정지 ${p.adBan-abs()}주 남음`); return; }
  if(S.cash<K.c){ toast('자금이 부족해요'); return; }
  S.cash-=K.c; setCd('p'+p.id+kind, CD_WEEKS[kind]);
  const fk='p'+p.id+kind, ft=fatigue(fk); S.adUse[fk]=(S.adUse[fk]||0)+1;
  const copyM=[0.8,1,1.5][S.copy], qm = 0.4 + p.quality/100;
  if(K.m) p.mkt += K.m * copyM * qm * (pow||mktPower()) * ft;
  if(K.u){ p.ugc += K.u * (p.quality>=50?1:0.3) * ft; if(p.quality<50) p.negUgc += K.u*0.7; }
  if(K.a) gainAware(K.a*ft);
  addFans([p.tar], K.f*ft);
  if(K.v && Math.random()<0.04*K.v*(0.6+p.nd[5]/100)){ p.viral+=2; toast(`🔥 ${esc(p.name)} 인플루언서 영상이 터졌다!`); }
  log(`📣 ${esc(p.name)}: ${K.n} 집행 (${money(K.c)})${ft<0.6?' — 같은 마케팅 반복으로 효과 감소':''}`);
  { const mk=S.staff.filter(x=>MKT_ROLES.includes(x.role)&&!x.away), best=Math.max(0,...mk.map(x=>x.st.buzz)), lupang=mk.filter(x=>x.type==='월급루팡').length;
    const risk=[0.003,0.015,0.08][S.copy]*(1+0.35*lupang)/(1+best/150);

  render();
}

function doExpo(tier){

function dinner(){ const c=S.staff.length*30; S.cash-=c; if(Math.random()<0.12){ S.staff.forEach(s=>s.morale=clamp(s.morale-5,0,100)); log('🍻 회식... 2차 노래방까지 끌려가서 오히려 사기 하락'); toast('🍻 회식 역효과...'); } else { S.staff.forEach(s=>{s.morale=clamp(s.morale+12,0,100); s.stamina=clamp(s.stamina+5,0,100);}); log('🍖 회식으로 팀워크 상승!'); } render(); }
function moveOffice(){ const nx=OFFICES[S.office+1]; if(!nx) return; if(hrCount()<nx.hr){ toast(`인사 직원이 ${nx.hr}명 필요해요`); return; } if(S.cash<nx.cost){toast('자금이 부족해요');return;} S.cash-=nx.cost; S.office++; log(`🏠 <b>${nx.n}</b>로 이전! (이전비 ${money(nx.cost)} · 월세 ${money(nx.rent)})`);
  queueModal({onOpen:()=>jingle('hit',0.6), pre:icoHtml('rocket','pop'), title:`🏠 ${nx.n} 입주!`, body:`<b>${S.office+1}단계</b> 사무실로 이전했다. 직원 정원 ${nx.cap-1}명.<br><span class="muted">월세가 ${money(nx.rent)}로 올랐다. 열심히 팔자!</span>`, choices:[{label:'새 사무실 최고!'}]}); render(); }
function buildFactory(){ const L=factLv(), nf=FACT[L+1]; if(!nf) return; if(rdCount()<nf.rd){ toast(`연구 인력이 ${nf.rd}명 필요해요`); return; } if(S.cash<nf.cost){toast('자금이 부족해요');return;}
  S.cash-=nf.cost; S.factory=L+1; log(`🏭 <b>${nf.n}</b> ${L?'증설':'설립'}! 원가 −${Math.round((1-nf.uc)*100)}% · 입고 ${nf.lt}주`);
  queueModal({onOpen:()=>jingle('hit'), pre:icoHtml('boxes','pop'), title:`🏭 ${nf.n} ${L?'증설':'준공'}!`, body:`${money(nf.cost)}를 들인 공장이 가동을 시작했다.<br>· 원가 −${Math.round((1-nf.uc)*100)}% · 입고 ${nf.lt}주${nf.q?`<br>· 신제품 품질 +${nf.q}`:''}${nf.oem?'<br>· 🤝 타사 OEM 수주로 매달 부가 수입':''}`, choices:[{label:'공장 돌려라!'}]}); render(); }
function oemIncome(){ const f=FACT[factLv()]; if(!f||!f.oem) return 0; return Math.round(5000*Math.max(1,rdCount()/10)); }
function resetGame(){ queueModal({title:'처음부터 다시', body:'현재 진행 상황이 사라집니다.', choices:[{label:'새로 시작', fn:()=>{ try{localStorage.removeItem(SAVE);}catch(e){} setTimeout(showStart,0);}},{label:'취소',cls:'gray'}]}); }

function tabInbox(){
  const ib=S.inbox||[], aa=S.autoApprove||{};
  return `<div class="card"><h4>📥 결재함</h4><div class="muted">운영은 발주, 마케터는 광고, 연구원은 신원료 도입, 디자이너는 패키지 리뉴얼, MD는 입점·기획전, 인사는 워크숍·정부지원사업 기안을 올린다. 기안서는 4주 안에 처리하지 않으면 만료된다. 마케터 능력(화제성)이 높을수록 광고 효율(★)이 좋고 제품·채널 선택도 똑똑하다.</div>
    <div class="row" style="margin-top:6px"><button class="btn sm mint" onclick="approveAll()" ${ib.length?'':'disabled'}>전체 승인</button>
    <button class="btn sm ${aa.order?'mint':'gray'}" onclick="S.autoApprove=Object.assign({},S.autoApprove,{order:!(S.autoApprove||{}).order});render()">발주 전결 ${aa.order?'ON':'OFF'}</button>
    <button class="btn sm ${aa.ad?'mint':'gray'}" onclick="S.autoApprove=Object.assign({},S.autoApprove,{ad:!(S.autoApprove||{}).ad});render()">광고 전결 ${aa.ad?'ON':'OFF'}</button></div>
    <div class="muted" style="font-size:11px;margin-top:2px">전결 ON이면 기안이 올라오는 즉시 자동 승인된다.</div></div>`+
   (ib.length?ib.slice().reverse().map(o=>`<div class="card"><div class="row" style="justify-content:space-between"><b>${o.type==='order'?'📦':o.type==='ad'?'📣':'📑'} ${esc(o.title)}</b><span class="muted">${o.at}</span></div>
     <div class="muted">기안: ${esc(o.by)} · ${o.detail}</div><div class="muted">비용 <b>${money(o.cost)}</b> · ${Math.max(0,o.exp-abs())}주 뒤 만료</div>
     <div class="row" style="margin-top:4px"><button class="btn sm mint" onclick="approveP(${o.id})" ${S.cash<o.cost?'disabled':''}>승인</button><button class="btn sm gray" onclick="rejectP(${o.id})">반려</button></div></div>`).join('')
   :'<div class="card muted">처리할 기안서가 없다.</div>');
}
const TABS={결재:tabInbox,제품:tabProducts,직원:tabStaff,마케팅:tabMkt,외주:tabOffers,시장:tabMarket,도감:tabDogam,회사:tabCompany};
function renderTabs(){
  const n=(S.inbox||[]).length;
  $('#tabs').innerHTML = Object.keys(TABS).map(t=>`<button class="${curTab===t?'on':''}" onclick="curTab='${t}';render()">${t}${t==='결재'&&n?`<em class="badge">${n}</em>`:''}</button>`).join('');
  const body=$('#tabBody'); const sc=body.scrollTop;
  body.innerHTML = TABS[curTab]();
  body.scrollTop=sc;
}
function renderLog(){ const tk=$('#ticker'); if(tk&&S&&S.log[0]) tk.innerHTML=`<span class="when">${S.log[0].t}</span>${S.log[0].h}`; const l=$('#log'); if(!l||!S) return; const now=dateStr(); l.innerHTML = `<div class="loghead">📰 최근 소식 <span class="muted">(최신순)</span></div>`+S.log.slice(0,40).map(x=>`<div class="${x.t===now?'new':''}"><span class="when">${x.t}</span>${x.h}</div>`).join(''); l.scrollTop=0; }
function render(){ if(!S || !$('#top')) return; renderTop(); renderOffice(); renderTabs(); renderLog(); }

function showGame(){
  $('#app').innerHTML = `<div id="hdr"><div id="top" class="px"></div><div id="weekbar"><i></i></div></div>
   <div id="main"><div><div id="officeWrap" class="px"><div id="officeHead"></div><div id="sky"></div><div id="obg"></div><div id="office"></div><div id="devBox"></div></div></div>
   <div id="panel" class="px"><div id="tabs"></div><div id="tabBody"></div></div></div>
   <div id="log" class="px"></div><div id="ticker" onclick="document.getElementById('log').scrollIntoView({behavior:'smooth'})"></div>`;
  render(); setSpeed(speed);
}
// ---------- 회귀 오프닝 ----------
function playOpening(brand, done){
  const ceoName=$('#cn')?$('#cn').value.trim():'';
  const B=brand?`「${esc(brand)}」`:'내 브랜드';
  const SC=[
    {bg:'dead', spr:'sleep', rain:1, t:'2037년 겨울.<br>화장품 MD로 15년. 마지막엔 내 이름을 건 브랜드까지 차렸다.'},
    {bg:'dead', spr:'sleep', rain:1, ic:['boxes','cloud'], snd:'crisis', t:'남은 건 창고에 쌓인 재고 3만 개와 대출 이자.<br>...끝났다.'},
    {bg:'black', t:'그때 그 성분이 뜰 줄 알았더라면.<br>그때 그 사람을 뽑지 않았더라면.<br>처음부터 다시 할 수 있다면...'},
    {bg:'flash', petals:1, t:'어디선가 벚꽃잎이 날아들었다.'},
    {bg:'room', spr:'대표', petals:1, bgm:1, t:'...눈을 떠보니 <b>2027년 봄</b>.<br>10년 전, 창업 첫날의 원룸이었다.'},
    {bg:'room', spr:'jump', petals:1, t:'뭐가 뜨고, 뭐가 망하고, 누가 월급루팡인지...<br><b>전부 기억난다.</b>'},
    {bg:'title', t:`이번엔 다르다.<br>${B}, K뷰티의 전설이 되어주마.${ceoName?`<br><span style="font-size:13px">— 대표 ${esc(ceoName)}</span>`:''}`}
  ];
  let i=0, typing=null, full='';
  const ov=document.createElement('div'); ov.id='op'; ov.innerHTML=`<div class="op-stage"><div class="op-bg"></div><div class="op-rain"></div><div class="op-pet"></div><div class="op-ic"></div><div class="op-spr"></div><div class="op-title"><div class="pre">회귀한 MD가</div><div class="logo">K뷰티 전설이 되다</div></div></div><div class="op-txt"><span></span><i>▼</i></div><button class="op-skip">건너뛰기 ▶▶</button>`;
  document.body.appendChild(ov);
  const st=ov.querySelector('.op-stage'), tx=ov.querySelector('.op-txt span');
  const finish=()=>{ clearInterval(typing); ov.remove(); done&&done(); };
  const show=()=>{ const c=SC[i]; st.className='op-stage bg-'+c.bg+(c.rain?' rain':'')+(c.petals?' pet':'');
    const sp=ov.querySelector('.op-spr'); sp.innerHTML=c.spr?`<span class="spr big" style="${sprStyle(SPR_IDX[c.spr]??0)}"></span>`:'';
    ov.querySelector('.op-ic').innerHTML=(c.ic||[]).map(k=>icoHtml(k,'pop')).join('');
    if(c.snd) jingle(c.snd,0.7); if(c.bgm) playBgm('bgm');
    full=c.t; let n=0; const plain=full.replace(/<br>/g,'\n').replace(/<[^>]+>/g,''); clearInterval(typing);
    typing=setInterval(()=>{ n++; tx.innerHTML=plain.slice(0,n).replace(/\n/g,'<br>'); if(n>=plain.length){ clearInterval(typing); typing=null; tx.innerHTML=full; } },38);
  };
  ov.querySelector('.op-skip').onclick=(e)=>{ e.stopPropagation(); finish(); };
  ov.onclick=()=>{ if(typing){ clearInterval(typing); typing=null; tx.innerHTML=full; return; } i++; if(i>=SC.length) finish(); else show(); };
  show();
}
function migrate(){
  if((S.v||0)<5){ S.office=[0,4,7][S.office]??S.office; if(S.factory===true) S.factory=1; S.ceo=S.ceo||(S.staff[0]&&S.staff[0].name)||'나'; S.v=5; }
}
function showStart(){
  clearInterval(timer); S=null; modalQ=[]; modalOpen=false; $('#modalBg').style.display='none';
  const saved=load();
  $('#app').innerHTML = `<div id="start" class="px"><div class="titleart"><div class="pre">회귀한 MD가</div><div class="logo">K뷰티 전설이 되다</div></div>
    <p style="margin-top:18px">대표 이름</p>
    <input id="cn" maxlength="8" placeholder="예: 백승규" value="">
    <p style="margin-top:8px">브랜드 이름</p>
    <input id="bn" maxlength="12" placeholder="예: 셀로라바이" value="">
    <div class="row" style="justify-content:center;margin-top:10px">
      <button class="btn pink" id="go">다시 창업하기</button>
      ${saved&&!saved.over?`<button class="btn sky" id="cont">이어하기 (${esc(saved.brand)}, ${saved.year}년 ${saved.month}월)</button>`:''}
    </div>
    <div style="margin-top:8px"><button class="btn gray" id="opv" style="font-size:12px;padding:4px 10px">🎬 오프닝 보기</button></div>
    <div class="card" style="text-align:left;margin-top:14px;font-size:13px">
      <b>플레이 방법</b><br>· 시간은 자동으로 흐릅니다 (⏸로 일시정지, ▶▶로 빠르게)<br>· 🧴 신제품 기획 → 조합·개발 방식 선택 → 단계마다 담당자 지정 → QC 후 출시<br>· 리뷰 합계 32점 이상이면 🏛️명예의 전당, 후속작을 낼 수 있어요<br>· 직원을 뽑을 땐 예상 능력치만 보여요. 진짜 실력은 일을 시켜봐야 알아요<br>· 💡노하우로 직원 레벨업·전직·개발 부스트를 해요<br>· 자금이 부족하면 🤝외주로 버티세요. 3달 연속 적자면 부도!</div></div>`;
  $('#opv').onclick=()=>{ SND.started=true; playOpening(null, ()=>{}); };
  $('#go').onclick=()=>{ const n=$('#bn').value.trim()||'나의 브랜드', ceo=$('#cn').value.trim()||'나'; SND.started=true;
    playOpening(n, ()=>{ newGame(n, ceo); speed=0; showGame(); playBgm('bgm');
    queueModal({title:'🌸 두 번째 창업 첫날', body:`<b>${esc(n)}</b>의 첫 출근날. (두 번째)<br>자본금 6,000만원, 원룸 사무실, 그리고 대표 <b>${esc(ceo)}</b> 혼자.<br><br>💭 <b>회귀 기억</b>이 남아 있는 동안엔 내년에 뜰 성분을 미리 알 수 있다. 하지만 미래를 바꿀수록 기억은 흐려진다.<br><br>먼저 <b>🧴 신제품 기획</b>으로 첫 제품을 만들어 보자.`, choices:[{label:'이번엔 다르다!', fn:()=>setSpeed(1)}]}); }); };
  if($('#cont')) $('#cont').onclick=()=>{ S=saved; if(S.comps) COMPS=S.comps; migrate(); if(S.yearStartNet===undefined){ S.yearStartNet=S.cash-(S.loan||0); S.loan=S.loan||0; S.loanRate=S.loanRate||0.06; S.taxDue=0; } if(!S.clv){ S.clv=1; } speed=1; showGame(); };
}
document.addEventListener('keydown',e=>{ if(!S||modalOpen) return; if(e.code==='Space' && document.activeElement.tagName!=='INPUT'){ e.preventDefault(); setSpeed(speed?0:1); } });
showStart();

</script>
</body>
</html>
